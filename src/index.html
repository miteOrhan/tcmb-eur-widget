<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
    <title>TCMB EUR Widget</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="widget" id="widget" aria-label="TCMB günlük EUR/TRY kuru">
      <div class="glow" aria-hidden="true"></div>

      <header class="head">
        <div class="badge" aria-hidden="true">€</div>
        <div class="title">
          <b>EUR / TRY</b>
          <span>TCMB · Günlük 15:30</span>
        </div>
        <div class="actions">
          <button id="refresh" class="icon-btn" type="button" title="Yenile" aria-label="Yenile">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12a9 9 0 1 1-2.64-6.36" />
              <path d="M21 3v6h-6" />
            </svg>
          </button>
          <button id="hide" class="icon-btn" type="button" title="Gizle" aria-label="Gizle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 12h14" />
            </svg>
          </button>
        </div>
      </header>

      <div class="prices">
        <div class="col">
          <span class="lbl">Alış</span>
          <b class="value" id="buy">—</b>
          <em class="pct" id="buyPct"></em>
        </div>
        <div class="divider" aria-hidden="true"></div>
        <div class="col">
          <span class="lbl">Satış</span>
          <b class="value" id="sell">—</b>
          <em class="pct" id="sellPct"></em>
        </div>
      </div>

      <footer class="foot">
        <span class="date" id="date">Veri yükleniyor…</span>
        <span class="stamp"><i class="dot" id="dot"></i><span id="updated">—</span></span>
      </footer>
    </section>

    <script src="app.js"></script>
  </body>
</html>
